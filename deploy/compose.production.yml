name: pulse

x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

x-api-image: &api-image
  image: ${PULSE_API_IMAGE:-pulse-api}:${PULSE_TAG:-latest}
  build:
    context: ..
    dockerfile: Dockerfile
    target: api

x-backend: &backend
  <<: *api-image
  env_file: .env
  environment:
    NODE_ENV: production
    APP_URL: ${APP_URL:-https://${DOMAIN}}
    APP_VERSION: ${PULSE_TAG:-latest}
    DATABASE_URL: ${DATABASE_URL:-postgres://pulse:${POSTGRES_PASSWORD}@postgres:5432/pulse}
    REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/0
    TRUST_PROXY: ${TRUST_PROXY:-1}
  read_only: true
  tmpfs:
    - /tmp
  cap_drop:
    - ALL
  security_opt:
    - no-new-privileges:true
  logging: *logging

services:
  caddy:
    image: ${PULSE_WEB_IMAGE:-pulse-web}:${PULSE_TAG:-latest}
    build:
      context: ..
      dockerfile: Dockerfile
      target: web
    restart: unless-stopped
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:-${DOMAIN}}
      API_UPSTREAM: api:3000
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
      - "${HTTPS_PORT:-443}:443/udp"
    volumes:
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      api:
        condition: service_healthy
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    logging: *logging

  migrate:
    <<: *backend
    command: ["node", "src/db/migrate.ts"]
    restart: "no"
    healthcheck:
      disable: true
    depends_on:
      postgres:
        condition: service_healthy
        required: false

  api:
    <<: *backend
    command: ["node", "src/server.ts"]
    restart: unless-stopped
    stop_grace_period: 15s
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - 'fetch("http://127.0.0.1:3000/api/health/ready").then((r) => process.exit(r.ok ? 0 : 1), () => process.exit(1))'
      interval: 15s
      timeout: 5s
      start_period: 20s
      retries: 3
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy

  worker:
    <<: *backend
    command: ["node", "src/worker.ts"]
    restart: unless-stopped
    stop_grace_period: 40s
    healthcheck:
      test: ["CMD", "node", "src/scripts/worker-healthcheck.ts"]
      interval: 30s
      timeout: 10s
      start_period: 30s
      retries: 3
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy

  redis:
    image: redis:8-alpine
    restart: unless-stopped
    command:
      - redis-server
      - --appendonly
      - "yes"
      - --maxmemory
      - ${REDIS_MAXMEMORY:-256mb}
      - --maxmemory-policy
      - noeviction
      - --requirepass
      - ${REDIS_PASSWORD:?REDIS_PASSWORD is required}
    environment:
      REDISCLI_AUTH: ${REDIS_PASSWORD}
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli ping | grep -q PONG"]
      interval: 10s
      timeout: 5s
      retries: 5
    security_opt:
      - no-new-privileges:true
    logging: *logging

  postgres:
    image: postgres:18-alpine
    profiles: ["local-db"]
    restart: unless-stopped
    environment:
      POSTGRES_USER: pulse
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-}
      POSTGRES_DB: pulse
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pulse -d pulse"]
      interval: 10s
      timeout: 5s
      retries: 5
    security_opt:
      - no-new-privileges:true
    logging: *logging

volumes:
  caddy-data:
  caddy-config:
  redis-data:
  postgres-data:
